<script id="slides-data" type="application/json">[{"number": 1, "title": "九州大学から見る未来社会", "src": "slides/01.webp", "thumb": "thumbs/01.webp", "notes": "皆さま、こんにちは。\nただいまご紹介いただきました、国立台湾師範大学名誉教授の林震煌です。\n本日は、このような貴重な機会をいただき、誠にありがとうございます。\n私は九州大学の大学院で修士号と博士号を取得しました。その後、台湾で大学教員として研究と教育に携わりながら、九州大学との交流を長年続けてまいりました。また、九州大学の台北オフィスの運営にも長く関わってきましたので、今日は九州大学について、単なる外部の紹介者ではなく、台湾と九州大学の両方を知る立場からお話ししたいと思います。本日のテーマは、「九州大学から見る未来社会」です。最近は、AI、半導体、水素エネルギーなど、私たちの社会を大きく変える技術が次々と登場しています。\nしかし、技術が進歩するだけで、本当に豊かな社会が実現するのでしょうか。新しい技術を生み出す人、その技術を社会に役立てる人、そして国境を越えて協力する人が必要です。今日は九州大学の取り組みを通して、未来社会を支える技術と人材、そして台湾と日本の協力の可能性について、皆さまと一緒に考えてみたいと思います。"}, {"number": 2, "title": "未来社会を考える5つの視点", "src": "slides/02.webp", "thumb": "thumbs/02.webp", "notes": "それでは、本日の講演の内容を、五つのテーマに分けてご紹介したいと思います。\nまず一つ目は、九州大学の歴史です。1911年の九州帝国大学の創設から、1922年のアインシュタインの訪問、そして現在の伊都キャンパスまで、九州大学がどのように発展してきたのかを振り返ります。\n二つ目は、科学技術です。AI、半導体、水素エネルギーを中心に、九州大学が未来社会に向けて、どのような研究に取り組んでいるのかをご紹介します。三つ目は、人材育成です。\n優れた技術があっても、それを社会に生かす人材がいなければ、イノベーションは生まれません。QBSやQREC、芸術工学などの取り組みを通して、新しい価値を生み出す人材の育成について考えます。\n四つ目は、大学の戦略です。九州大学が掲げるVISION 2030を通して、大学が研究や教育だけでなく、社会の変革にどのように貢献しようとしているのかを見ていきます。そして五つ目は、台湾と日本の連携です。\n半導体分野での大学間協力や国際的な研究ネットワークを例に、台湾と九州がこれから何を一緒に実現できるのかを考えたいと思います。この五つのテーマを通して、私が皆さまと共有したいのは、未来社会をつくるのは、技術だけではなく、それを生かす人材と、人と人とのつながりであるということです。\nそれでは、まず九州大学の歴史から始めましょう。"}, {"number": 3, "title": "九州大学の歴史", "src": "slides/03.webp", "thumb": "thumbs/03.webp", "notes": "まず、九州大学の歴史からご紹介します。\n九州大学は1911年に九州帝国大学として設立されました。東京、京都、東北に続く、日本で4番目の帝国大学です。\n当初は医学と工学を中心に発展しましたが、その後、理学、農学、人文社会科学などへと教育研究の領域を広げてきました。この年表を見ると、大学が社会の変化に合わせて、新しい学問分野を取り入れてきたことが分かります。\n例えば、100年以上前には、医学や工学が近代社会を支える重要な学問でした。\nそして現在では、AI、半導体、量子技術、脱炭素などが、新しい社会をつくる重要な研究領域になっています。\nつまり、大学の役割は、これまでに蓄積された知識を守るだけではありません。\n社会の変化を先取りして、次の時代に必要な知識と人材を育てること。\nこれが、九州大学の歴史から読み取れる重要な特徴だと思います。"}, {"number": 4, "title": "アインシュタインと九州大学", "src": "slides/04.webp", "thumb": "thumbs/04.webp", "notes": "ここで、九州大学の歴史に関する、少し興味深い話をご紹介します。\n今から100年以上前の1922年、あの有名な物理学者、アルベルト・アインシュタインが日本を訪問しました。\nこの年、アインシュタインは日本各地を巡り、九州帝国大学も訪れています。\n1922年といえば、日本の大学が海外の最先端科学を積極的に取り入れようとしていた時代です。\nそして、アインシュタインが九州を訪れたという事実は、当時の日本における科学の国際交流を象徴する出来事の一つだと思います。当時の日本とヨーロッパは、今ほど簡単に行き来できる時代ではありませんでした。\nそれでも、科学者は国境を越えて交流していました。\n私はこの話を聞くたびに、科学の発展には、優れた研究者だけでなく、異なる文化や考え方との出会いが大切なのだと感じます。そして100年以上たった現在、九州大学は台湾や世界各国の大学と連携しています。\n時代が変わっても、大学が世界とつながることの重要性は変わらないのです。"}, {"number": 5, "title": "伊都キャンパス", "src": "slides/05.webp", "thumb": "thumbs/05.webp", "notes": "それでは、現在の九州大学をご紹介しましょう。\nこちらは、福岡市の西部に位置する伊都キャンパスです。\n福岡市の中心部から西へ向かった、糸島地域に近い場所にあります。\n実は私も現在、福岡の西部に滞在していますので、この地域はとても身近に感じています。\n伊都キャンパスの大きな特徴は、自然と最先端研究施設が共存していることです。\n周囲には山があり、少し足を延ばせば、美しい海岸が広がっています。\n一方、キャンパス内には工学、理学、農学などの研究施設が集まり、最先端の研究が進められています。\n私は、こうした自然環境に恵まれた場所で、世界水準の教育研究を行えることは、九州大学の大きな魅力だと思います。"}, {"number": 6, "title": "伊都キャンパスの広さ", "src": "slides/06.webp", "thumb": "thumbs/06.webp", "notes": "この伊都キャンパスは、実際にどれくらい広いのでしょうか。\n面積は約272万平方メートルです。\nこの数字だけでは、なかなか広さを想像できないと思います。\nそこで、台湾の皆さまに分かりやすいように、台北市の大安森林公園と比較してみました。\n伊都キャンパスの面積は、なんと大安森林公園の約10.5個分になります。\n非常に広いですね。私も九州大学に行くたびに、建物から建物までの距離の長さを実感します。\nしかし、ここで重要なのは、キャンパスが広いことだけではありません。\n広い敷地の中に、研究施設、教育施設、産学連携拠点が集まっていることです。\nつまり、伊都キャンパスは単なる大学の敷地ではなく、未来の技術や新しいアイデアが生まれる、一つの研究都市のような場所なのです。"}, {"number": 7, "title": "九州大学の10の魅力", "src": "slides/07.webp", "thumb": "thumbs/07.webp", "notes": "現在の九州大学には、どのような特色があるのでしょうか。\n今回、私は九州大学の教育研究の強みを、10の分野に整理してみました。\nまず、未来社会を支える技術として、AI・データサイエンス、半導体、水素・脱炭素エネルギーがあります。\n次に、これらの技術を社会に生かすための教育として、ビジネス・スクールのQBSと、起業家精神を育てるQRECがあります。さらに、国際連携を進めるQ-AOS、科学とデザインを融合する芸術工学、将来の可能性を広げる量子技術があります。そして、人々の健康を守る医学・ライフサイエンス、食料や環境を支える農学・森林科学です。\n一見すると、それぞれ別々の分野に見えるかもしれません。しかし、これらには共通点があります。\nそれは、大学で生まれた知識を、人間の暮らしや社会の未来につなげるという考え方です。\nこれから、この10分野について順番に見ていきたいと思います。"}, {"number": 8, "title": "AI・データサイエンス", "src": "slides/08.webp", "thumb": "thumbs/08.webp", "notes": "最初にご紹介するのは、AIとデータサイエンスです。皆さまも最近、ChatGPTなどの生成AIを使われる機会が増えたのではないでしょうか。数年前まで、AIは主に情報工学の専門家が扱う技術でした。しかし現在では、医学、化学、経済学、農学、そして芸術の分野にまで急速に広がっています。\n九州大学では、データ駆動イノベーション推進本部が、教育、研究、医療、大学運営などのデジタル変革を推進しています。また、数理・データサイエンス教育研究センターでは、幅広い専門分野の学生がデータ科学を学ぶための教育を支援しています。ここで大切なのは、全員をAIの専門家にするということではありません。\n例えば、医師がAIを使って診断を支援する。化学者が大量の分析データから新しい知見を見いだす。芸術家がAIを制作や研究に活用する。私自身も、ラマン分光法で得られるスペクトルとAIを組み合わせる研究に関心を持っています。これから必要なのは、単にAIを使える人ではなく、自分の専門知識とAIを組み合わせ、新しい問題を解決できる人材です。大学教育も、いま大きく変わろうとしています。"}, {"number": 9, "title": "半導体研究・人材育成", "src": "slides/09.webp", "thumb": "thumbs/09.webp", "notes": "二つ目は半導体です。\n台湾の皆さまにとって、半導体は非常に身近なテーマだと思います。\n現在の世界では、スマートフォン、自動車、医療機器、AIサーバーなど、あらゆるものに半導体が使われています。そして今、九州でも半導体産業が大きく変化しています。特にTSMCの熊本進出によって、九州は日本の半導体産業の重要な拠点として、再び注目されるようになりました。九州大学では、半導体・デバイスエコシステム研究教育センター、CSeDEが、次世代デバイスの研究開発や産学連携を推進しています。また、価値創造型半導体人材育成センター、ECSVCでは、単に製造技術を理解するだけでなく、新しい価値を生み出せる人材の育成を目指しています。ここで注目したいのは、半導体産業には非常に多くの専門分野が必要だということです。材料、化学、電気電子、機械、情報、経営まで、さまざまな知識が関わっています。\n工場は資金があれば建設できますが、高度な技術を理解し、次の世代の半導体を開発できる人材は、短期間では育ちません。半導体産業の競争力を決めるのは、設備だけではなく、人材なのです。\nこのことは、台湾と日本の大学が協力する大きな理由にもなっています。"}, {"number": 10, "title": "水素・脱炭素・エネルギー", "src": "slides/10.webp", "thumb": "thumbs/10.webp", "notes": "三つ目は、水素とエネルギーの研究です。\n九州大学は、水素研究において世界的に知られた研究拠点の一つです。\n特にサステナブル水素研究所、通称HYDROGENIUSでは、水素材料、安全性、そして水素を社会で利用するための技術開発が進められています。こちらの写真をご覧ください。\n上の写真は水素を取り扱う研究設備、下の写真は水素ステーションと燃料電池自動車です。\nつまり九州大学では、研究室での基礎研究から、実際の社会で水素を利用するための研究まで行われています。\nでは、なぜ水素が重要なのでしょうか。現在、世界は脱炭素社会への転換を目指しています。\n太陽光や風力などの再生可能エネルギーは重要ですが、天候や時間によって発電量が変わります。\nそこで、エネルギーを蓄え、運び、必要なときに利用するための選択肢の一つとして、水素が期待されています。ただし、水素は自然から無条件に得られるエネルギーではありません。製造方法によって環境への影響が異なり、輸送や貯蔵にも課題があります。こうした問題を一つずつ解決していくことが、大学の研究の重要な役割です。そして、AIを動かすにも、半導体を製造するにも、大量の電力が必要です。\n未来社会を支えるには、情報技術だけでなく、持続可能なエネルギー技術も欠かせないのです。"}, {"number": 11, "title": "ビジネス・スクール（QBS）", "src": "slides/11.webp", "thumb": "thumbs/11.webp", "notes": "ここまで、AI、半導体、水素エネルギーという三つの技術分野を見てきました。\nしかし、どれほど優れた技術が生まれても、それが社会で使われなければ、人々の生活は変わりません。\nそこで重要になるのが、経営とビジネスの知識です。九州大学には、九州大学ビジネス・スクール、QBSがあります。QBSでは、実践的な経営教育を通して、企業経営や技術経営に関わる人材を育成しています。\n特に私が重要だと思うのは、技術と経営を結びつけるという視点です。例えば、大学で新しい材料や分析技術が開発されたとします。研究としては優れていても、製品化するには市場のニーズ、コスト、知的財産、事業計画などを考えなければなりません。研究者だけでは対応できない課題もあります。そのため、技術を理解する人と、事業をつくる人が協力する必要があります。研究成果を社会の価値に変える。QBSの教育は、こうした役割を担う人材の育成につながっていると思います。"}, {"number": 12, "title": "QREC・アントレプレナーシップ教育", "src": "slides/12.webp", "thumb": "thumbs/12.webp", "notes": "次にご紹介するのは、QRECです。\nQRECは、九州大学のアントレプレナーシップ教育を推進するセンターです。\nアントレプレナーシップという言葉は、日本語では「起業家精神」と訳されます。\nしかし、必ずしも会社を設立することだけを意味するわけではありません。\n例えば、身近な社会問題に気づくこと。その問題を解決するために、新しい方法を考えること。そして、仲間と協力しながら実際に行動してみること。これらも起業家精神の重要な要素です。\n九州大学のQRECでは、専門分野の異なる学生たちが一緒に学び、創意工夫や課題解決に挑戦する機会を提供しています。ここで面白いのは、学生が必ずしも経営学を専攻しているわけではないことです。\n工学、理学、農学、芸術など、さまざまな分野の学生が参加できます。\n私は、これからの社会では、与えられた問題を正しく解く能力だけではなく、自分で問題を発見し、新しい挑戦を始める能力がますます重要になると思います。\nQBSが経営の専門性を育てる場だとすれば、QRECは、幅広い学生の挑戦する力を育てる場だと言えるでしょう。"}, {"number": 13, "title": "アジア・オセアニア研究教育機構（Q-AOS）", "src": "slides/13.webp", "thumb": "thumbs/13.webp", "notes": "次に、九州大学の国際的な取り組みをご紹介します。\nQ-AOSは、九州大学アジア・オセアニア研究教育機構の略称です。\nアジア・オセアニア地域を中心として、人文科学、社会科学、自然科学など、さまざまな分野の研究者が協力する組織です。現在の社会問題は、一つの専門分野だけでは解決できません。\n例えば、地球温暖化を考えてみましょう。自然科学による気候変動の研究はもちろん重要ですが、それだけではありません。エネルギー政策、経済活動、人々の生活習慣、さらには国際協力も関係してきます。\nだからこそ、異なる専門分野の研究者が一緒に考える必要があります。\nQ-AOSの大きな特徴は、このような分野横断型の研究と国際交流を結びつけていることです。\nそして、右下の写真をご覧ください。こちらは、九州大学が海外で開催しているフォーラム「KYUDAI NOW」の台湾開催に関するものです。こうした活動を通じて、九州大学の研究成果を海外に紹介するだけでなく、現地の大学や研究者、企業との新しいネットワークをつくっています。大学の国際交流は、単なる訪問や表敬ではなく、新しい共同研究や人材育成につながることが大切です。"}, {"number": 14, "title": "芸術工学・デザイン", "src": "slides/14.webp", "thumb": "thumbs/14.webp", "notes": "ここで、少し違った分野をご紹介したいと思います。\n九州大学には、芸術工学部と大学院芸術工学府があります。\n皆さまは、「芸術工学」という言葉を聞かれたことがあるでしょうか。\n一般に、芸術と工学は異なる分野だと思われています。\nしかし、芸術工学では、科学技術とデザインを融合させ、人間と社会にとってより良い環境や製品、サービスを生み出すことを目指しています。こちらの図を見ると、インダストリアルデザイン、メディアデザイン、環境設計、音響設計、未来構想デザインなど、幅広い分野が含まれていることが分かります。\n例えば、スマートフォンを考えてみましょう。内部には高度な半導体技術が使われていますが、使いやすさ、美しさ、操作方法などは、デザインの力によって大きく変わります。私自身も、もともとは分析化学を専門としていましたが、現在は文化財保存科学や芸術の分野にも研究を広げています。\nその経験から、異なる分野を結びつけることの重要性を強く感じています。\n新しい技術を生み出すだけでなく、人間にとって使いやすく、心地よいものにする。"}, {"number": 15, "title": "量子技術・量子コンピューティング", "src": "slides/15.webp", "thumb": "thumbs/15.webp", "notes": "続いて、量子技術です。\n近年、AIと並んで注目されているのが、量子コンピューティングです。\n皆さまは、量子コンピューターと聞くと、どのようなものを想像されるでしょうか。\n量子コンピューターは、従来のコンピューターとは異なる原理を利用して計算を行う技術です。\nすべての計算が速くなるわけではありませんが、特定の問題について、従来とは異なる可能性が期待されています。例えば、分子や材料の性質を理解する研究、複雑な最適化問題などです。\n九州大学でも、量子コンピューティングシステム研究センターを中心に、関連する研究が進められています。\nまた、右側の写真は、曲げたり形状を変えたりできる電子回路に関する研究を紹介したものです。\nこちらは量子コンピューターそのものではありませんが、電子技術が従来の硬い基板から、柔軟で新しい用途を持つ方向へ広がっている例です。つまり、未来のコンピューティングは、計算原理だけでなく、材料やデバイスの形も変わっていく可能性があります。まだ実現していない可能性に挑戦することも、大学研究の大切な使命なのです。"}, {"number": 16, "title": "医学・先端医療・ライフサイエンス", "src": "slides/16.webp", "thumb": "thumbs/16.webp", "notes": "次に、医学とライフサイエンスです。\n九州大学には、九州大学病院と生体防御医学研究所という重要な研究・医療拠点があります。\n九州大学病院は、高度な医療を提供するとともに、臨床研究や医療人材の育成を担っています。\n一方、生体防御医学研究所では、生命現象や病気の仕組みを分子・細胞レベルから研究しています。\nここで注目したいのは、医療とAIの関係です。\n例えば、医療画像の解析、病気の早期発見、遺伝子情報の分析など、医療のさまざまな分野でAIの活用が進んでいます。しかし、AIが医師のすべての仕事を代わりにできるわけではありません。\n患者さんの状態や気持ちを理解し、総合的に判断するのは、やはり人間の重要な役割です。\n未来の医療では、医師とAIがそれぞれの強みを生かして協力することが重要になると思います。"}, {"number": 17, "title": "農学・森林・環境科学", "src": "slides/17.webp", "thumb": "thumbs/17.webp", "notes": "九州大学の10番目の特色は、農学、森林、環境科学です。\n未来社会というと、どうしてもAIやロボット、半導体などの先端技術に注目しがちです。\nしかし、私たちが生きていくうえで、食料、水、森林、自然環境は欠かせません。\n九州大学では、農学部の研究に加えて、広大な演習林を活用した森林科学や環境研究も行われています。\n例えば、気候変動が森林に与える影響、持続可能な農業、食料資源の利用などは、これからますます重要になります。また、農業や森林研究にも、AIやデータサイエンスが利用されるようになっています。つまり、最先端のデジタル技術と自然環境の研究は、決して無関係ではありません。\n未来社会とは、技術が進歩した社会であるだけでなく、人間と自然が持続可能な形で共存できる社会でもあると私は考えています。ここまで、九州大学の10の特色をご紹介しました。\n次に、こうした研究や教育を大学全体としてどのように発展させようとしているのか、最近の動きを見ていきましょう。"}, {"number": 18, "title": "未来社会を考える4つの問い", "src": "slides/18.webp", "thumb": "thumbs/18.webp", "notes": "ここで、皆さまと一緒に、未来社会について四つの問いを考えてみたいと思います。\nまず一つ目は、AIです。10年後、私たちはまだ、すべてのデータを自分で分析する必要があるのでしょうか。AIが分析を担うようになれば、人間には、データから何を読み取り、どう判断するかという能力が、ますます重要になると思います。二つ目は、半導体です。台湾は世界をリードする半導体産業を持っています。一方、九州でも半導体産業が急速に発展しています。台湾と九州が協力することで、次の世代の技術者や研究者を一緒に育てることができるのではないでしょうか。\n三つ目は、エネルギーです。10年後の自動車や工場は、どのようにして二酸化炭素の排出を減らしていくのでしょうか。水素や再生可能エネルギーなど、新しい技術の研究が、その答えを探す重要な鍵になります。\nそして四つ目は、QRECのアントレプレナーシップ教育です。\n大学は、学生が持つ一つの小さなアイデアを、社会の課題を解決する新しい事業へと育てることができるのでしょうか。この四つの問いは、一見すると別々の問題に見えます。\nしかし、実は共通点があります。それは、未来社会をつくるためには、新しい技術だけでなく、それを使いこなし、新しい価値を生み出す人材が必要だということです。\nそして、九州大学はまさに、その技術と人材の両方を育てようとしているのです。"}, {"number": 19, "title": "近年の新たな動き", "src": "slides/19.webp", "thumb": "thumbs/19.webp", "notes": "ここからは、九州大学の最近の動きをご紹介します。\nこちらのスライドには、2021年から2026年にかけての重要な出来事を四つまとめています。\nまず2021年、九州大学は文部科学大臣から指定国立大学法人に指定されました。\nこれは、国際的な競争力を持ち、社会に大きく貢献する研究大学として、さらに発展していくことが期待されているということです。次に、2025年には、量子科学と宇宙科学などを結びつける新しい研究機構が設立されました。さらに同じ年、台湾の国立陽明交通大学と半導体人材育成に関する協力が進みました。\nそして2026年も、海外校友会や国際フォーラムを通じて、世界とのネットワークを広げています。\nこの四つの出来事には、一つの共通した方向性があります。それは、研究力を高めるだけではなく、産業、人材育成、国際交流を結びつけて、大学全体の競争力を高めようとしていることです。これからの大学には、個々の優れた研究だけではなく、それを社会につなげる総合的な戦略が求められていると思います。"}, {"number": 20, "title": "台湾・陽明交通大学との連携", "src": "slides/20.webp", "thumb": "thumbs/20.webp", "notes": "それでは、九州大学の未来戦略が、台湾とどのようにつながっているのかをご紹介します。\nこちらは、2025年7月に進められた、九州大学と台湾の国立陽明交通大学との半導体分野における人材育成の協力です。\n台湾は、世界でも非常に重要な半導体産業の拠点です。\n一方、日本には、半導体材料、製造装置、精密加工、基礎研究などに強みがあります。\nさらに九州では、熊本を中心に半導体産業の集積が進んでいます。\nつまり、台湾と九州は、産業面で非常に補完性の高い関係にあります。\nしかし、ここで重要なのは、企業同士の協力だけではありません。\n長期的な半導体産業の発展には、研究者や技術者を育てる大学の役割が欠かせません。\n例えば、台湾の学生が九州で日本の研究開発を学ぶ。日本の学生が台湾の半導体産業を理解する。そして両国の研究者が共同研究を行う。\nこのような人的交流が積み重なることによって、両国の協力関係はさらに強くなります。\n私は、台湾と日本の半導体協力を、工場建設の段階から、共同研究と人材育成の段階へ発展させることが、これから非常に重要だと思っています。"}, {"number": 21, "title": "KOOU・UAATによる国際連携", "src": "slides/21.webp", "thumb": "thumbs/21.webp", "notes": "ここからは、台湾と九州の大学連携について、もう一つ重要な取り組みをご紹介します。\nそれが、KOOUとUAATの連携です。\nKOOUは、九州・沖縄オープンユニバーシティ、UAATは台湾の大学連盟です。\n2024年4月23日、両者は国際連携に関する覚書を締結しました。\nこの取り組みの大きな特徴は、一つの大学と一つの大学の連携ではないことです。\n複数の大学を結ぶ、大学連盟同士の連携なのです。\nなぜ、このような仕組みが必要なのでしょうか。\n例えば、半導体の共同研究を進めたいと考えた場合、材料、電子工学、情報、製造技術など、さまざまな専門家が必要になります。\n一つの大学だけでは、必要な専門分野をすべてそろえることが難しい場合があります。\nしかし、複数の大学が連携すれば、それぞれの強みを持ち寄ることができます。\n私は、このような大学連盟の協力は、これからの国際共同研究において、非常に有効な仕組みになると考えています。"}, {"number": 22, "title": "KOOU・UAAT参加大学", "src": "slides/22.webp", "thumb": "thumbs/22.webp", "notes": "こちらが、KOOUとUAATに参加する大学の一覧です。\n九州・沖縄側が11大学、台湾側が12大学、合わせて23大学が参加しています。\nここで注目したいのは、大学の数そのものよりも、それぞれの大学が異なる特色を持っていることです。\nある大学は半導体や情報工学に強く、別の大学は医学や生命科学に強いかもしれません。\nまた、農学、人文社会科学、教育など、さまざまな専門分野もあります。\nそれぞれの大学が持つ強みを結びつけることで、一対一の大学交流では実現しにくい、大規模な共同研究や教育プログラムが可能になります。\nさらに台湾と九州は、地理的にも非常に近い関係にあります。\n距離が近いということは、学生や研究者が実際に行き来しやすいという大きな利点があります。\nこの地理的な近さを、学術的な近さ、そして人的な信頼関係へと発展させることが重要だと思います。"}, {"number": 23, "title": "KOOU・UAAT連携分野", "src": "slides/23.webp", "thumb": "thumbs/23.webp", "notes": "では、この大学連盟では、具体的にどのような分野の協力が考えられているのでしょうか。\nこちらのスライドに示したように、半導体、生命科学、工学、自然科学、社会科学・人文学、そして中国語教育など、幅広い分野が含まれています。\nここで興味深いのは、半導体だけに限定していないことです。\n確かに、現在は半導体産業が非常に注目されています。\nしかし、台湾と日本の関係を長期的に考えるなら、科学技術だけでなく、文化や言語、社会への理解も大切です。例えば、共同研究を進める場合、専門知識が同じでも、言葉や仕事の進め方の違いによって、協力が難しくなることがあります。そのため、学生時代から異なる国の人々と一緒に学び、考え、行動する経験が重要になります。私は、これからの大学間交流は、単に学生を交換したり、協定を結んだりする段階から、さらに進む必要があると思います。交流から共創へ。一緒に新しい知識を生み出し、一緒に新しい技術を開発し、一緒に次の世代の人材を育てる。台湾と九州の大学連携には、そのような発展を期待しています。"}, {"number": 24, "title": "未来社会と台日共創", "src": "slides/24.webp", "thumb": "thumbs/24.webp", "notes": "最後に、今日のお話をまとめたいと思います。\n本日は九州大学の歴史から始まり、10の教育研究分野、大学の未来戦略、そして台湾と九州の国際連携についてご紹介しました。これらの話を通して、私が最もお伝えしたかったことは、未来社会は、一つの技術だけでは実現できないということです。ここで、最初にご紹介した三つの重要な分野に戻りたいと思います。\n一つ目は、AIです。AIは、これからの社会において、人間の知識や判断を支援する重要な技術になります。\n二つ目は、半導体です。AIを動かすためには高度な半導体が必要です。そして、半導体は自動車、通信、医療など、さまざまな産業の基盤でもあります。三つ目は、水素を含むエネルギー技術です。\nどれほど優れたAIや半導体があっても、それを持続可能な形で動かすエネルギーがなければ、未来社会は成立しません。つまり、AIは知能、半導体は計算基盤、エネルギーは社会を動かす力だと言えます。\nそして、この三つの分野を考えると、台湾と日本には非常に大きな協力の可能性があります。\n台湾には世界をリードする半導体産業があり、日本には材料、製造装置、エネルギー、基礎研究などの強みがあります。これから重要になるのは、どちらが優れているかを競うことだけではありません。\nそれぞれの強みを生かして、何を一緒につくることができるかということです。\n私は、未来社会をつくるキーワードは、「競争」だけではなく「共創」だと思っています。\nそして、そこには大学の大きな役割があります。\n企業は新しい製品やサービスを生み出します。政府は政策や制度を整えます。\n一方、大学には10年後、20年後の社会を担う人材を育てるという、非常に重要な使命があります。\n台湾と日本の大学が研究をつなぎ、人材をつなぎ、そして社会をつないでいく。\nその積み重ねが、これからの台日関係をさらに強くしていくのではないでしょうか。"}, {"number": 25, "title": "ご清聴ありがとうございました", "src": "slides/25.webp", "thumb": "thumbs/25.webp", "notes": "本日は、九州大学から見た未来社会について、私なりの考えをお話しさせていただきました。\n未来がどのような社会になるのか、正確に予測することは、誰にもできません。\nしかし、どのような未来をつくりたいのかを考え、そのために行動することはできます。\n私自身、九州大学で学び、台湾で研究と教育に携わってきた一人として、これからも台湾と日本の交流に少しでも貢献したいと考えています。今日のお話が、皆さまにとって、未来社会と台日協力の可能性について考える、一つのきっかけになれば幸いです。今後とも、台湾と日本の交流と連携を、どうぞよろしくお願いいたします。\nご清聴、誠にありがとうございました。"}, {"number": 26, "title": "九州の歴史物語と旅の風景（参考）", "src": "slides/26.webp", "thumb": "thumbs/26.webp", "notes": ""}]</script>
<script>
(()=>{'use strict';
const data=JSON.parse(document.getElementById('slides-data').textContent);const $=id=>document.getElementById(id);let index=0;
const slide=$('slide'),notes=$('notes'),noteText=$('note-text'),noteButton=$('notes-btn'),strip=$('strip');
function setNotes(open){notes.classList.toggle('show',open);noteButton.classList.toggle('note-on',open);noteButton.textContent=open?'📖 隱藏講稿':'📖 顯示講稿';noteButton.setAttribute('aria-expanded',String(open));}
function numFromHash(){const m=location.hash.match(/^#slide-(\d+)$/);return m?Math.max(0,Math.min(data.length-1,Number(m[1])-1)):0;}
function go(i,writeHash=true){index=Math.max(0,Math.min(data.length-1,i));const d=data[index];slide.src=d.src;slide.alt=`${d.number}. ${d.title}`;$('count').textContent=`${d.number} / ${data.length}`;$('page').value=d.number;$('note-title').textContent=`第 ${d.number} 頁講稿｜${d.title}`;noteText.textContent=d.notes||'這一頁的原始 PowerPoint 沒有附講稿備註。';noteText.classList.toggle('no-notes',!d.notes);$('prev').disabled=index===0;$('next').disabled=index===data.length-1;Array.from(strip.children).forEach((b,k)=>b.classList.toggle('active',k===index));if(writeHash&&location.hash!==`#slide-${d.number}`){try{history.replaceState(null,'',`#slide-${d.number}`)}catch(e){try{location.hash=`slide-${d.number}`}catch(_){}}}if(index<data.length-1){const pre=new Image();pre.src=data[index+1].src}}
data.forEach((d,i)=>{const b=document.createElement('button');b.className='thumb';const im=document.createElement('img');im.src=d.thumb;im.loading='lazy';im.alt='';const t=document.createElement('span');t.textContent=`${d.number}. ${d.title}`;b.append(im,t);b.addEventListener('click',()=>go(i));strip.append(b)});
$('prev').addEventListener('click',()=>go(index-1));$('next').addEventListener('click',()=>go(index+1));$('page').addEventListener('change',e=>go(Number(e.target.value)-1));noteButton.addEventListener('click',()=>setNotes(!notes.classList.contains('show')));$('notes-close').addEventListener('click',()=>setNotes(false));$('strip-btn').addEventListener('click',()=>strip.classList.toggle('show'));
$('full').addEventListener('click',()=>{if(document.fullscreenElement){document.exitFullscreen().catch(()=>{})}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen().catch(()=>document.body.classList.toggle('fullscreen'))}else{document.body.classList.toggle('fullscreen')}});
window.addEventListener('hashchange',()=>{const i=numFromHash();if(i!==index)go(i,false)});
document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName))return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();go(index+1)}else if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();go(index-1)}else if(e.key.toLowerCase()==='n'){setNotes(!notes.classList.contains('show'))}else if(e.key.toLowerCase()==='t'){strip.classList.toggle('show')}else if(e.key.toLowerCase()==='f'){$('full').click()}});
let start=null;slide.addEventListener('touchstart',e=>{start=e.changedTouches[0].screenX},{passive:true});slide.addEventListener('touchend',e=>{if(start===null)return;const delta=e.changedTouches[0].screenX-start;if(Math.abs(delta)>45)go(index+(delta<0?1:-1));start=null},{passive:true});
go(numFromHash());
})();
</script></body></html>
